<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #111827, #0f172a);
      color: white;
      font-family: Arial, sans-serif;
    }
    .game-wrap { text-align: center; }
    h1 { margin-bottom: 12px; letter-spacing: 2px; }
    #gameCanvas {
      border: 4px solid #f8fafc;
      background: #111827;
      width: min(420px, 92vw);
      height: auto;
      display: block;
      box-shadow: 0 0 25px rgba(255,255,255,0.1);
    }
    .hud { margin-top: 12px; font-size: 18px; font-weight: bold; }
    .controls { margin-top: 8px; color: #dbeafe; font-size: 14px; }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>CAR GAME</h1>
    <canvas id="gameCanvas" width="420" height="700"></canvas>
    <div class="hud">Score: <span id="score">0</span></div>
    <div class="controls">Use Left / Right arrow keys or A / D to move</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    const ROAD = { x: 70, width: 280, laneCount: 3, laneWidth: 280 / 3 };
    const player = {
      width: 42,
      height: 72,
      x: canvas.width / 2 - 21,
      y: canvas.height - 110,
      speed: 7
    };

    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let lastTime = 0;
    let spawnTimer = 0;
    let roadSpeed = 4;
    const keys = {};

    function resetGame() {
      player.x = canvas.width / 2 - player.width / 2;
      player.y = canvas.height - 110;
      obstacles = [];
      score = 0;
      gameOver = false;
      roadSpeed = 4;
      spawnTimer = 0;
      scoreEl.textContent = "0";
    }

    function randomLane() {
      return Math.random() * ROAD.laneCount | 0;
    }

    function createObstacle() {
      const lane = randomLane();
      const laneX = ROAD.x + lane * ROAD.laneWidth + 20;
      obstacles.push({
        x: laneX,
        y: -80,
        width: 42,
        height: 72,
        color: ["#ef4444", "#3b82f6", "#f59e0b", "#10b981", "#a855f7"][Math.floor(Math.random() * 5)],
        speed: roadSpeed + Math.random() * 2
      });
    }

    function rectCollision(a, b) {
      return a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y;
    }

    function update(delta) {
      if (gameOver) return;
      const keyLeft = keys.ArrowLeft || keys.a || keys.A;
      const keyRight = keys.ArrowRight || keys.d || keys.D;
      if (keyLeft) player.x -= player.speed;
      if (keyRight) player.x += player.speed;
      player.x = Math.max(ROAD.x, Math.min(ROAD.x + ROAD.width - player.width, player.x));

      spawnTimer += delta;
      if (spawnTimer > 1100) {
        createObstacle();
        spawnTimer = 0;
      }

      for (const obstacle of obstacles) {
        obstacle.y += obstacle.speed * (delta / 16.67);
      }
      obstacles = obstacles.filter(obstacle => obstacle.y < canvas.height + 100);

      if (obstacles.some(obstacle => rectCollision(player, obstacle))) gameOver = true;
      score += delta * 0.01;
      scoreEl.textContent = Math.floor(score);
      roadSpeed = 4 + Math.floor(score / 150);
    }

    function drawRoad() {
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(ROAD.x, 0, ROAD.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      for (let y = 10; y < canvas.height; y += 80) {
        ctx.fillRect(ROAD.x + ROAD.laneWidth - 4, y, 8, 60);
        ctx.fillRect(ROAD.x + ROAD.laneWidth * 2 - 4, y, 8, 60);
      }
      ctx.fillStyle = "#facc15";
      ctx.fillRect(ROAD.x, 0, 4, canvas.height);
      ctx.fillRect(ROAD.x + ROAD.width - 4, 0, 4, canvas.height);
    }

    function drawPlayerCar() {
      const { x, y, width: w, height: h } = player;
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(x + 8, y, w - 16, h);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(x + 10, y + 8, w - 20, 18);
      ctx.fillStyle = "#fef3c7";
      ctx.fillRect(x + 8, y + 2, 8, 10);
      ctx.fillRect(x + w - 16, y + 2, 8, 10);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(x + 4, y + 8, 8, 16);
      ctx.fillRect(x + w - 12, y + 8, 8, 16);
      ctx.fillRect(x + 4, y + h - 24, 8, 16);
      ctx.fillRect(x + w - 12, y + h - 24, 8, 16);
    }

    function drawObstacle(car) {
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(car.x + 6, car.y + 8, car.width - 12, 16);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(car.x + 4, car.y + 6, 8, 16);
      ctx.fillRect(car.x + car.width - 12, car.y + 6, 8, 16);
      ctx.fillRect(car.x + 4, car.y + car.height - 22, 8, 16);
      ctx.fillRect(car.x + car.width - 12, car.y + car.height - 22, 8, 16);
    }

    function drawGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 42px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = "20px Arial";
      ctx.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 25);
    }

    window.addEventListener("keydown", event => {
      keys[event.key] = true;
      if ((event.key === "r" || event.key === "R") && gameOver) resetGame();
      if (["ArrowLeft", "ArrowRight", "a", "d", "A", "D"].includes(event.key)) event.preventDefault();
    });
    window.addEventListener("keyup", event => { keys[event.key] = false; });

    function loop(timestamp) {
      const delta = Math.min(timestamp - (lastTime || timestamp), 32);
      lastTime = timestamp;
      update(delta);
      drawRoad();
      for (const car of obstacles) drawObstacle(car);
      drawPlayerCar();
      if (gameOver) drawGameOver();
      requestAnimationFrame(loop);
    }

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
